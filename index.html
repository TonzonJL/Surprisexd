<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flor Amarilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
    :root {
        --amarillo-1: #FFEBAE;
        --amarillo-2: #FFD467;
        --amarillo-3: #F5A623;
        --amarillo-4: #C97A1C;
        --amarillo-oscuro: #8A5A12;
        --centro-1: #8A5323;
        --centro-2: #3E2408;
        --verde-1: #4C7A3D;
        --verde-2: #2E5024;
        --fondo-1: #0c0e09;
        --fondo-2: #1c1408;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        margin: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Cormorant Garamond', serif;
        background:
            radial-gradient(ellipse at 50% 38%, var(--fondo-2) 0%, var(--fondo-1) 62%, #000 100%);
        position: relative;
    }

    /* Viñeta y textura sutil */
    .vineta {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
        z-index: 3;
    }

    /* Bokeh de fondo */
    .bokeh {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 212, 103, 0.18) 0%, rgba(255, 212, 103, 0) 70%);
        filter: blur(1px);
        animation: derivar ease-in-out infinite alternate;
        z-index: 0;
    }

    @keyframes derivar {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(var(--dx, 20px), var(--dy, -15px)) scale(1.15); }
    }

    /* Polvo dorado flotando */
    .particula {
        position: absolute;
        bottom: -10px;
        border-radius: 50%;
        background: var(--amarillo-2);
        opacity: 0.55;
        filter: blur(0.3px);
        animation: flotar linear infinite;
        z-index: 1;
    }

    @keyframes flotar {
        0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.65; }
        90%  { opacity: 0.35; }
        100% { transform: translateY(-112vh) translateX(var(--desvio, 20px)) rotate(180deg); opacity: 0; }
    }

    /* Destellos titilantes */
    .destello {
        position: absolute;
        width: 6px;
        height: 6px;
        z-index: 4;
        animation: titilar ease-in-out infinite;
    }
    .destello::before, .destello::after {
        content: "";
        position: absolute;
        background: var(--amarillo-1);
        border-radius: 2px;
    }
    .destello::before { width: 100%; height: 1.5px; top: 50%; left: 0; transform: translateY(-50%); }
    .destello::after   { height: 100%; width: 1.5px; left: 50%; top: 0; transform: translateX(-50%); }

    @keyframes titilar {
        0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
        50%      { opacity: 0.9; transform: scale(1.1) rotate(45deg); }
    }

    .contenedor {
        text-align: center;
        position: relative;
        z-index: 5;
    }

    /* Texto de dedicatoria */
    .texto {
        color: var(--amarillo-1);
        font-family: 'Dancing Script', cursive;
        font-size: clamp(26px, 4.5vw, 42px);
        font-weight: 600;
        letter-spacing: 0.5px;
        opacity: 0;
        text-shadow: 0 0 18px rgba(255, 201, 77, 0.4);
        animation: aparecer 2.2s ease-out forwards;
    }

    /* Filigrana decorativa bajo el texto */
    .filigrana {
        width: 220px;
        margin: 14px auto 50px;
        opacity: 0;
        animation: aparecer 2.2s ease-out 0.3s forwards;
    }
    .filigrana svg { width: 100%; height: auto; overflow: visible; }
    .filigrana path, .filigrana circle {
        stroke: var(--amarillo-2);
        fill: none;
        stroke-width: 1;
        opacity: 0.75;
    }
    .filigrana circle { fill: var(--amarillo-2); stroke: none; }

    /* Resplandor suave detrás de la flor */
    .aura {
        position: absolute;
        top: 46%;
        left: 50%;
        width: 300px;
        height: 300px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 212, 103, 0.3) 0%, rgba(255, 212, 103, 0) 70%);
        filter: blur(6px);
        animation: respirar 4s ease-in-out infinite;
        z-index: 0;
    }

    @keyframes respirar {
        0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
        50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Tallo y hojas */
    .planta {
        position: relative;
        width: 260px;
        height: 340px;
        margin: 0 auto;
    }

    .tallo {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 6px;
        height: 130px;
        margin-left: -3px;
        background: linear-gradient(180deg, var(--verde-1), var(--verde-2));
        border-radius: 4px;
        transform-origin: bottom center;
        animation: mecerTallo 6s ease-in-out infinite;
        z-index: 2;
    }

    .hoja {
        position: absolute;
        bottom: 34px;
        width: 46px;
        height: 22px;
        background: linear-gradient(135deg, var(--verde-1), var(--verde-2));
        border-radius: 0 100% 0 100%;
        z-index: 1;
    }
    .hoja::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 8%;
        width: 84%;
        height: 1px;
        background: rgba(255,255,255,0.25);
        transform: rotate(3deg);
    }
    .hoja-izq { left: 50%; margin-left: -46px; transform: rotate(18deg); }
    .hoja-der { left: 50%; margin-left: 2px; transform: rotate(-18deg) scaleX(-1); }

    /* La flor: tres capas de pétalos para dar profundidad */
    .flor {
        position: absolute;
        bottom: 118px;
        left: 50%;
        width: 240px;
        height: 240px;
        margin-left: -120px;
        z-index: 3;
        animation: girarLento 30s linear infinite, mecerFlor 6s ease-in-out infinite;
        transform-origin: 50% 100%;
    }

    .capa { position: absolute; inset: 0; }
    .capa-trasera  { animation: girarLento 48s linear infinite reverse; }
    .capa-media    { animation: girarLento 38s linear infinite; }

    .petalo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 104px;
        margin-left: -20px;
        margin-top: -104px;
        transform-origin: 50% 100%;
        border-radius: 60% 60% 6% 6% / 78% 78% 22% 22%;
        background: linear-gradient(180deg, var(--amarillo-1) 0%, var(--amarillo-2) 50%, var(--amarillo-3) 85%, var(--amarillo-4) 100%);
        box-shadow: inset 0 -8px 12px rgba(138, 90, 18, 0.4), 0 3px 8px rgba(0,0,0,0.3);
    }

    /* Brillo satinado sobre cada pétalo */
    .petalo::before {
        content: "";
        position: absolute;
        left: 18%;
        top: 10%;
        width: 26%;
        height: 55%;
        background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
        border-radius: 50%;
        filter: blur(1px);
        opacity: 0.6;
    }

    /* Vena central del pétalo */
    .petalo::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 10%;
        width: 1.5px;
        height: 80%;
        background: rgba(138, 90, 18, 0.35);
        transform: translateX(-50%);
    }

    .capa-media .petalo {
        width: 34px;
        height: 92px;
        margin-left: -17px;
        margin-top: -92px;
        opacity: 0.95;
        filter: saturate(0.97) brightness(0.98);
    }

    .capa-trasera .petalo {
        width: 30px;
        height: 78px;
        margin-left: -15px;
        margin-top: -78px;
        opacity: 0.82;
        filter: saturate(0.9) brightness(0.9);
    }

    /* 10 pétalos por capa, intercalados entre capas */
    .capa-frontal .p1  { transform: rotate(0deg); }
    .capa-frontal .p2  { transform: rotate(36deg); }
    .capa-frontal .p3  { transform: rotate(72deg); }
    .capa-frontal .p4  { transform: rotate(108deg); }
    .capa-frontal .p5  { transform: rotate(144deg); }
    .capa-frontal .p6  { transform: rotate(180deg); }
    .capa-frontal .p7  { transform: rotate(216deg); }
    .capa-frontal .p8  { transform: rotate(252deg); }
    .capa-frontal .p9  { transform: rotate(288deg); }
    .capa-frontal .p10 { transform: rotate(324deg); }

    .capa-media .p1  { transform: rotate(18deg); }
    .capa-media .p2  { transform: rotate(54deg); }
    .capa-media .p3  { transform: rotate(90deg); }
    .capa-media .p4  { transform: rotate(126deg); }
    .capa-media .p5  { transform: rotate(162deg); }
    .capa-media .p6  { transform: rotate(198deg); }
    .capa-media .p7  { transform: rotate(234deg); }
    .capa-media .p8  { transform: rotate(270deg); }
    .capa-media .p9  { transform: rotate(306deg); }
    .capa-media .p10 { transform: rotate(342deg); }

    .capa-trasera .p1  { transform: rotate(9deg); }
    .capa-trasera .p2  { transform: rotate(45deg); }
    .capa-trasera .p3  { transform: rotate(81deg); }
    .capa-trasera .p4  { transform: rotate(117deg); }
    .capa-trasera .p5  { transform: rotate(153deg); }
    .capa-trasera .p6  { transform: rotate(189deg); }
    .capa-trasera .p7  { transform: rotate(225deg); }
    .capa-trasera .p8  { transform: rotate(261deg); }
    .capa-trasera .p9  { transform: rotate(297deg); }
    .capa-trasera .p10 { transform: rotate(333deg); }

    /* Estambres alrededor del centro */
    .estambres {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 90px;
        height: 90px;
        transform: translate(-50%, -50%);
        z-index: 6;
    }
    .estambre {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2px;
        height: 34px;
        margin-left: -1px;
        margin-top: -34px;
        background: linear-gradient(180deg, var(--amarillo-oscuro), var(--centro-1));
        transform-origin: 50% 100%;
    }
    .estambre::after {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--amarillo-1);
        transform: translateX(-50%);
        box-shadow: 0 0 4px rgba(255, 235, 174, 0.8);
    }
    .e1 { transform: rotate(0deg); }
    .e2 { transform: rotate(30deg); }
    .e3 { transform: rotate(60deg); }
    .e4 { transform: rotate(90deg); }
    .e5 { transform: rotate(120deg); }
    .e6 { transform: rotate(150deg); }
    .e7 { transform: rotate(180deg); }
    .e8 { transform: rotate(210deg); }
    .e9 { transform: rotate(240deg); }
    .e10{ transform: rotate(270deg); }
    .e11{ transform: rotate(300deg); }
    .e12{ transform: rotate(330deg); }

    /* Centro de la flor */
    .centro {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 30%, var(--centro-1), var(--centro-2) 75%);
        box-shadow: 0 0 0 3px rgba(255, 212, 103, 0.3), inset 0 -4px 8px rgba(0,0,0,0.45);
        z-index: 7;
    }

    .centro::before {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background-image: radial-gradient(rgba(255, 235, 174, 0.55) 1px, transparent 1.4px);
        background-size: 6px 6px;
        opacity: 0.65;
    }

    @keyframes girarLento {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes mecerFlor {
        0%, 100% { rotate: -3deg; }
        50%      { rotate: 3deg; }
    }

    @keyframes mecerTallo {
        0%, 100% { rotate: -2.5deg; }
        50%      { rotate: 2.5deg; }
    }

    @keyframes aparecer {
        0%   { opacity: 0; transform: translateY(-16px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
        .planta { transform: scale(0.75); }
    }

    @media (prefers-reduced-motion: reduce) {
        .flor, .capa-trasera, .capa-media, .aura, .particula, .destello, .texto, .filigrana, .tallo { animation: none !important; opacity: 1 !important; }
    }
</style>
</head>
<body>

    <div class="vineta"></div>

    <div class="contenedor">
        <div class="texto">Arriba las esperanzas Abuelita</div>

        <div class="filigrana">
            <svg viewBox="0 0 220 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 10 H85" />
                <circle cx="95" cy="10" r="2.5" />
                <path d="M105 10 c5 -8 15 -8 20 0 c5 8 15 8 20 0" />
                <circle cx="150" cy="10" r="2.5" />
                <path d="M160 10 H220" />
            </svg>
        </div>

        <div class="planta">
            <div class="aura"></div>
            <div class="hoja hoja-izq"></div>
            <div class="hoja hoja-der"></div>
            <div class="tallo"></div>

            <div class="flor">
                <div class="capa capa-trasera">
                    <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                    <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                    <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                    <div class="petalo p10"></div>
                </div>
                <div class="capa capa-media">
                    <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                    <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                    <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                    <div class="petalo p10"></div>
                </div>
                <div class="capa capa-frontal">
                    <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                    <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                    <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                    <div class="petalo p10"></div>
                </div>
                <div class="estambres">
                    <div class="estambre e1"></div><div class="estambre e2"></div><div class="estambre e3"></div>
                    <div class="estambre e4"></div><div class="estambre e5"></div><div class="estambre e6"></div>
                    <div class="estambre e7"></div><div class="estambre e8"></div><div class="estambre e9"></div>
                    <div class="estambre e10"></div><div class="estambre e11"></div><div class="estambre e12"></div>
                </div>
                <div class="centro"></div>
            </div>
        </div>
    </div>

    <script>
        // Partículas doradas flotantes
        const totalParticulas = 24;
        for (let i = 0; i < totalParticulas; i++) {
            const p = document.createElement('div');
            p.className = 'particula';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.setProperty('--desvio', (Math.random() * 60 - 30) + 'px');
            p.style.animationDuration = (7 + Math.random() * 8) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            const tam = 2 + Math.random() * 3;
            p.style.width = p.style.height = tam + 'px';
            document.body.appendChild(p);
        }

        // Bokeh difuminado de fondo
        const totalBokeh = 8;
        for (let i = 0; i < totalBokeh; i++) {
            const b = document.createElement('div');
            b.className = 'bokeh';
            const tam = 40 + Math.random() * 90;
            b.style.width = b.style.height = tam + 'px';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.top = Math.random() * 100 + 'vh';
            b.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
            b.style.setProperty('--dy', (Math.random() * 40 - 20) + 'px');
            b.style.animationDuration = (6 + Math.random() * 6) + 's';
            document.body.appendChild(b);
        }

        // Destellos titilantes alrededor de la flor
        const totalDestellos = 10;
        const centroX = 50, centroY = 40;
        for (let i = 0; i < totalDestellos; i++) {
            const d = document.createElement('div');
            d.className = 'destello';
            const angulo = Math.random() * Math.PI * 2;
            const radio = 14 + Math.random() * 10;
            const x = centroX + Math.cos(angulo) * radio;
            const y = centroY + Math.sin(angulo) * radio * 0.6;
            d.style.left = x + 'vw';
            d.style.top = y + 'vh';
            d.style.animationDuration = (2 + Math.random() * 3) + 's';
            d.style.animationDelay = (Math.random() * 4) + 's';
            document.body.appendChild(d);
        }
    </script>

</body>
</html>
