<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flor Amarilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
    :root {
        --amarillo-1: #FFE49A;
        --amarillo-2: #FFC94D;
        --amarillo-3: #F5A623;
        --amarillo-oscuro: #B9770E;
        --centro-1: #7A4A1E;
        --centro-2: #4E2E10;
        --fondo-1: #10120d;
        --fondo-2: #1c1408;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Cormorant Garamond', serif;
        background:
            radial-gradient(ellipse at 50% 40%, var(--fondo-2) 0%, var(--fondo-1) 65%, #000 100%);
        position: relative;
    }

    /* Polvo dorado flotando en el fondo */
    .particula {
        position: absolute;
        bottom: -10px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--amarillo-2);
        opacity: 0.55;
        filter: blur(0.3px);
        animation: flotar linear infinite;
    }

    @keyframes flotar {
        0%   { transform: translateY(0) translateX(0); opacity: 0; }
        10%  { opacity: 0.6; }
        90%  { opacity: 0.4; }
        100% { transform: translateY(-110vh) translateX(var(--desvio, 20px)); opacity: 0; }
    }

    .contenedor {
        text-align: center;
        position: relative;
        z-index: 2;
    }

    /* Texto de dedicatoria */
    .texto {
        color: var(--amarillo-1);
        font-family: 'Dancing Script', cursive;
        font-size: clamp(26px, 4.5vw, 42px);
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 55px;
        opacity: 0;
        text-shadow: 0 0 18px rgba(255, 201, 77, 0.35);
        animation: aparecer 2.2s ease-out forwards;
    }

    /* Resplandor suave detrás de la flor */
    .aura {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 260px;
        height: 260px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 201, 77, 0.28) 0%, rgba(255, 201, 77, 0) 70%);
        filter: blur(6px);
        animation: respirar 4s ease-in-out infinite;
        z-index: 0;
    }

    @keyframes respirar {
        0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.92); }
        50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
    }

    /* La flor: dos capas de pétalos para dar profundidad */
    .flor {
        position: relative;
        width: 220px;
        height: 220px;
        margin: 0 auto;
        z-index: 1;
        animation: girarLento 26s linear infinite, mecer 6s ease-in-out infinite;
        transform-origin: center 140px; /* mece como si tuviera un tallo */
    }

    .capa {
        position: absolute;
        inset: 0;
    }

    .capa-trasera {
        animation: girarLento 40s linear infinite reverse;
    }

    .petalo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 100px;
        margin-left: -21px;
        margin-top: -100px;
        transform-origin: 50% 100%;
        border-radius: 60% 60% 8% 8% / 75% 75% 25% 25%;
        background: linear-gradient(180deg, var(--amarillo-1) 0%, var(--amarillo-2) 55%, var(--amarillo-3) 100%);
        box-shadow: inset 0 -6px 10px rgba(185, 119, 14, 0.35), 0 3px 8px rgba(0,0,0,0.25);
    }

    .petalo::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 12%;
        width: 1.5px;
        height: 78%;
        background: rgba(185, 119, 14, 0.3);
        transform: translateX(-50%);
    }

    .capa-trasera .petalo {
        width: 34px;
        height: 82px;
        margin-left: -17px;
        margin-top: -82px;
        opacity: 0.85;
        filter: saturate(0.9) brightness(0.95);
    }

    /* 8 pétalos capa frontal */
    .capa-frontal .p1 { transform: rotate(0deg); }
    .capa-frontal .p2 { transform: rotate(45deg); }
    .capa-frontal .p3 { transform: rotate(90deg); }
    .capa-frontal .p4 { transform: rotate(135deg); }
    .capa-frontal .p5 { transform: rotate(180deg); }
    .capa-frontal .p6 { transform: rotate(225deg); }
    .capa-frontal .p7 { transform: rotate(270deg); }
    .capa-frontal .p8 { transform: rotate(315deg); }

    /* 8 pétalos capa trasera, intercalados */
    .capa-trasera .p1 { transform: rotate(22.5deg); }
    .capa-trasera .p2 { transform: rotate(67.5deg); }
    .capa-trasera .p3 { transform: rotate(112.5deg); }
    .capa-trasera .p4 { transform: rotate(157.5deg); }
    .capa-trasera .p5 { transform: rotate(202.5deg); }
    .capa-trasera .p6 { transform: rotate(247.5deg); }
    .capa-trasera .p7 { transform: rotate(292.5deg); }
    .capa-trasera .p8 { transform: rotate(337.5deg); }

    /* Centro de la flor */
    .centro {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 30%, var(--centro-1), var(--centro-2) 75%);
        box-shadow: 0 0 0 3px rgba(255, 201, 77, 0.25), inset 0 -4px 6px rgba(0,0,0,0.4);
        z-index: 5;
    }

    .centro::before {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background-image: radial-gradient(rgba(255, 228, 154, 0.5) 1px, transparent 1.4px);
        background-size: 6px 6px;
        opacity: 0.6;
    }

    @keyframes girarLento {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes mecer {
        0%, 100% { rotate: -3deg; }
        50%      { rotate: 3deg; }
    }

    @keyframes aparecer {
        0%   { opacity: 0; transform: translateY(-16px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .flor, .capa-trasera, .aura, .particula, .texto { animation: none !important; opacity: 1 !important; }
    }
</style>
</head>
<body>

    <div class="contenedor">
        <div class="texto">Arriba las esperanzas Abuelita</div>

        <div class="aura"></div>
        <div class="flor">
            <div class="capa capa-trasera">
                <div class="petalo p1"></div>
                <div class="petalo p2"></div>
                <div class="petalo p3"></div>
                <div class="petalo p4"></div>
                <div class="petalo p5"></div>
                <div class="petalo p6"></div>
                <div class="petalo p7"></div>
                <div class="petalo p8"></div>
            </div>
            <div class="capa capa-frontal">
                <div class="petalo p1"></div>
                <div class="petalo p2"></div>
                <div class="petalo p3"></div>
                <div class="petalo p4"></div>
                <div class="petalo p5"></div>
                <div class="petalo p6"></div>
                <div class="petalo p7"></div>
                <div class="petalo p8"></div>
            </div>
            <div class="centro"></div>
        </div>
    </div>

    <script>
        // Genera partículas doradas flotantes
        const total = 22;
        for (let i = 0; i < total; i++) {
            const p = document.createElement('div');
            p.className = 'particula';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.setProperty('--desvio', (Math.random() * 60 - 30) + 'px');
            p.style.animationDuration = (7 + Math.random() * 8) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
            document.body.appendChild(p);
        }
    </script>

</body>
</html>
